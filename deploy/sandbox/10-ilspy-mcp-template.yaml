# ilspy-mcp sandbox template (the .NET/CIL decompilation engine).
#
# Single-container pod running the ILSpy-MCP HTTP MCP server on :3001, reached by
# ADK StreamableHTTP through a DIRECT pod port-forward (not the sandbox-router,
# which consumes Authorization and mangles the body). Mirrors the radare2-mcp
# template; the artifact is pushed in with `kubectl cp` by AREMA's prepare_ilspy.
#
# tcpSocket probes, not httpGet: the server exposes no health endpoint, and a bare
# GET /mcp answers 400 (a valid JSON-RPC error), which some probe configurations
# would treat as failure. tcpSocket just checks :3001 is listening.
#
# Before hostile code, set spec.podTemplate.spec.runtimeClassName to gvisor/kata.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: ilspy-mcp-runtime-template
  namespace: agent-sandbox-demo
spec:
  # Deny all ingress + egress: this pool statically analyses live malware and needs
  # no network. The agent-sandbox framework's DEFAULT managed policy ALLOWS internet
  # egress (see analysis-workbench + LESSONS_LEARNED #15), so declare empty rules to
  # make the managed policy deny both. The agent reaches :3001 via `kubectl
  # port-forward`, which is kubelet-mediated (not pod-network ingress) and so is
  # unaffected by deny-all ingress -- verified against a live radare2-mcp warm pod.
  networkPolicy:
    egress: []
    ingress: []
  podTemplate:
    metadata:
      labels:
        arema.dev/pool: ilspy-mcp
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Offline sandbox: fail DNS fast so a .NET/ILSpy hostname lookup (NuGet, a
      # symbol server) fails instantly instead of hanging on the deny-all egress
      # DROP. (/tmp is writable here -- no readonly rootfs -- so the .NET first-run
      # mutex the workbench needed a /tmp mount for is a non-issue.)
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
        options:
          - { name: ndots, value: "1" }
          - { name: timeout, value: "1" }
          - { name: attempts, value: "1" }
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ilspy-mcp
          image: arema-ilspy-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The .NET runtime is heavier than r2 at rest; decompiling a large
          # assembly is memory-bound rather than CPU-bound.
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
