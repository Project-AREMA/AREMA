[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arema"
version = "0.1.0"
description = "Extensible Google ADK foundation for Autonomous Reverse Engineering & Malware Analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AREMA" }
]
keywords = ["adk", "agent", "llm", "autonomous", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "google-adk==1.25.1",
    "litellm>=1.80.8,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.0,<26.0",
    "rich>=13.0,<15.0",
    "json-repair>=0.61.7",
    "pyzipper>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]
sandbox = [
    "k8s-agent-sandbox==0.5.2",
]

[project.scripts]
arema = "arema.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/arema",
    "src/greeter_agent",
    "src/reverse_engineering",
    "src/malware_analyst",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "S101",   # assert used (needed for tests)
    "S603",   # subprocess call (used to launch the ADK web CLI)
    "S607",   # subprocess partial path
    "S104",   # hardcoded bind address in string comparisons (false positive)
    "S105",   # hardcoded password - false positive on test fixture values
    "S108",   # hardcoded temp file paths in test fixtures (not real file ops)
    "S311",   # random used for non-cryptographic test data
    "E501",   # line too long (handled by formatter, allow in strings)
    "SIM105", # contextlib.suppress is less readable than try-except-pass
    "SIM117", # nested with is sometimes more readable
    "SIM102", # nested if statements sometimes more readable
    "SIM116", # dictionary instead of if/elif - not always more readable
    "RUF022", # __all__ sorting - we use comments to organize by category
    "ERA001", # commented code - false positive on __all__ category comments
]

[tool.ruff.lint.isort]
known-first-party = ["arema"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "component: Component tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/arema"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.10",
]
